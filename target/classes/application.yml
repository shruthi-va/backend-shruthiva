spring:
  application:
    name: claims-management
  datasource:
    url: jdbc:h2:mem:claimsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: claims-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.chubb.claims
        spring.json.value.default.type: com.chubb.claims.notification.application.ClaimStatusChangedEvent
        spring.json.use.type.headers: false
    listener:
      missing-topics-fatal: false

server:
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

claims:
  notifications:
    kafka:
      enabled: true
      topic: claim-status-changed
    outbox-poll-ms: 1000
  demo-users:
    claimant-username: ${CLAIMANT_USERNAME:claimant}
    claimant-password: ${CLAIMANT_PASSWORD:}
    staff-username: ${STAFF_USERNAME:staff}
    staff-password: ${STAFF_PASSWORD:}
    manager-username: ${MANAGER_USERNAME:manager}
    manager-password: ${MANAGER_PASSWORD:}
